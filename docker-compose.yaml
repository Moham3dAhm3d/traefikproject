services:
  reverse-proxy:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - ./config:/etc/traefik/config
    networks:
      - buiten
  
  whoami:
    image: traefik/whoami
    deploy:
      replicas: 3
    networks:
      - buiten
    
  
  website:
    image: httpd:2.4
    deploy:
      replicas: 3
    networks:
     - binnen
     - buiten
    
  database:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: Uiop
      POSTGRES_DB: randomdb
    networks:
      - binnen
  

networks:
  buiten:
  binnen: